name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore and test
        run: |
          dotnet restore Artix.API.sln --disable-parallel
          dotnet test Artix.API.sln -c Release --no-restore -m:1

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: artix-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Cleanup Docker data
        if: always()
        run: |
          docker image prune -af || true
          docker builder prune -af || true

  publish:
    needs: build-and-test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Cleanup Docker data
        if: always()
        run: |
          docker image prune -af || true
          docker builder prune -af || true

  deploy:
    needs: publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_PATH" ]; then
            echo "Skipping deploy: set SERVER_SSH_KEY, DEPLOY_HOST, DEPLOY_PATH."
            exit 0
          fi
          install -m 600 /dev/stdin <<< "$SSH_KEY" deploy_key
          ssh -i deploy_key -o StrictHostKeyChecking=accept-new "root@${DEPLOY_HOST}" "
            set -e
            cd '${DEPLOY_PATH}'
            git pull
            export APP_IMAGE='${IMAGE}'
            docker compose pull app1
            docker compose up -d --no-build
          "
