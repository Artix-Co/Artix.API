name: Docker

on:
  schedule Gen:
    branches: [ "dev" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "dev" ]
  schedule:
    - cron: '24 14 * * *' # Runs daily at 14:24 UTC

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: Artix-Co/Artix.API

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # Needed for cosign signing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.29.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 # v3.5.0
        with:
          cosign-release: 'v2.2.4'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata for images
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
            prefix=
            suffix=

      - name: Pull and build Docker images with docker-compose
        run: |
          # Pull external images (e.g., sqlserver:latest) before building
          docker-compose -f docker-compose.yaml pull
          docker-compose -f docker-compose.yaml build

      - name: Push Docker images to registry
        if: github.event_name != 'pull_request'
        run: |
          # Tag only services with a build context (skip prebuilt images like sqlserver)
          for service in $(docker-compose -f docker-compose.yaml config --services); do
            # Check if the service has a build configuration
            if docker-compose -f docker-compose.yaml config | grep -A 2 "services:$service" | grep -q "build:"; then
              image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-$service
              for tag in ${{ steps.meta.outputs.tags }}; do
                new_tag=${tag//${{ env.IMAGE_NAME }}/${{ env.IMAGE_NAME }}-$service}
                echo "Tagging $service as $new_tag"
                docker tag $service $new_tag
              done
            else
              echo "Skipping tagging for $service (no build context)"
            fi
          done
          docker-compose -f docker-compose.yaml push

      - name: Sign the published Docker images
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for service in $(docker-compose -f docker-compose.yaml config --services); do
            # Only sign images that were built (have build context)
            if docker-compose -f docker-compose.yaml config | grep -A 2 "services:$service" | grep -q "build:"; then
              image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-$service
              for tag in $TAGS; do
                new_tag=${tag//${{ env.IMAGE_NAME }}/${{ env.IMAGE_NAME }}-$service}
                digest=$(docker inspect --format='{{.Id}}' $new_tag 2>/dev/null || echo "")
                if [ -n "$digest" ]; then
                  echo "Signing $new_tag@$digest"
                  cosign sign --yes $new_tag@$digest
                else
                  echo "Warning: Image $new_tag not found, skipping signing"
                fi
              done
            else
              echo "Skipping signing for $service (no build context)"
            fi
          done
