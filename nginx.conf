events {
    worker_connections 2048; # افزایش تعداد اتصال‌های همزمان
    multi_accept on; # پذیرش چندین اتصال به‌صورت همزمان
}

http {
    # تنظیمات فشرده‌سازی Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6; # سطح فشرده‌سازی (6 تعادل خوبی بین سرعت و فشرده‌سازی است)
    gzip_buffers 16 8k;
    gzip_min_length 1000; # حداقل طول پاسخ برای فشرده‌سازی
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript;

    # تنظیمات کش
    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=my_cache:10m max_size=10g inactive=60m use_temp_path=off;

    upstream backend {
        server app1:80;
        server app2:80;
        server app3:80;
        keepalive 32; # حفظ اتصال‌های پایدار
    }

    server {
        listen 80;
        server_name localhost;

        # فعال‌سازی کش برای درخواست‌های GET
        proxy_cache my_cache;
        proxy_cache_valid 200 60s; # کش پاسخ‌های 200 به مدت 60 ثانیه
        proxy_cache_use_stale error timeout updating;
        proxy_cache_lock on;

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffer_size 16k;
            proxy_buffers 4 32k;
            proxy_busy_buffers_size 64k;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /health {
            proxy_pass http://backend;
            proxy_cache_bypass $http_pragma; # غیرفعال کردن کش برای Health Check
        }
    }
}