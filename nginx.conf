worker_processes auto;

events {
    worker_connections 16384;
    use epoll;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  30;
    keepalive_requests 10000;

    # Disable gzip for fastest API throughput
    gzip off;

    # Increase proxy buffers to reduce blocking
    proxy_buffering on;
    proxy_buffers 32 32k;
    proxy_busy_buffers_size 256k;

    # Optimize upstream timeouts for high load
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    # Temp storage
    proxy_temp_path /var/lib/nginx/tmp;

    upstream artix_upstream {
        zone backend 64k;
        server artix-api:80 max_fails=3 fail_timeout=5s;
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 100M;

        location / {
            proxy_pass http://artix_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
