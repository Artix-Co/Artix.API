worker_processes auto;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    upstream backend {
        server app1:80 max_fails=2 fail_timeout=10s;
        server app2:80 max_fails=2 fail_timeout=10s;
        server app3:80 max_fails=2 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_connect_timeout 5s;
            proxy_send_timeout 20s;
            proxy_read_timeout 30s;

            proxy_next_upstream error timeout http_502 http_503 http_504;

            proxy_next_upstream_tries 5;

            proxy_buffering on;
            proxy_buffers 32 32k;
            proxy_buffer_size 64k;

            # فعال کردن کش (در صورت امکان)
            # proxy_cache my_cache;
            # proxy_cache_valid 200 1m;
            # proxy_cache_use_stale error timeout updating;
        }

        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }

    # Optional: تعریف کش (در صورت نیاز)
    # proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=my_cache:10m max_size=100m inactive=60m use_temp_path=off;
}
