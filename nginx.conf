worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 10240;
    multi_accept on;
    use epoll;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 10000;
    types_hash_max_size 4096;
    server_tokens off;

    # Gzip فقط برای JSON/متن
    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 256;

    # کش فوق سریع در حافظه RAM
   proxy_cache_path /dev/shm/nginx_cache
       levels=1:2
       keys_zone=ultra_cache:512m  # اصلاح شد
       max_size=5g
       inactive=2h
       use_temp_path=off
       loader_files=1000
       loader_sleep=0
       loader_threshold=10m;

    server {
        listen 80;
        server_name localhost;

        # مسیر عمومی با کش ultra سریع
        location / {
            proxy_pass http://app1:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_buffering on;
            proxy_buffers 64 64k;       # افزایش اندازه بافر برای سرعت بیشتر
            proxy_buffer_size 128k;
            
            proxy_cache ultra_cache;
            proxy_cache_valid 200 30m;  # کش طولانی‌تر برای درخواست‌های موفق
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;  # بروزرسانی کش بدون بلوکه کردن کاربران
            
            proxy_connect_timeout 5s;
            proxy_send_timeout 20s;
            proxy_read_timeout 20s;
        }

        # Endpoint آپلود حجیم (بدون تغییر)
        location /api/shared/upload/ {
            proxy_pass http://app1:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_request_buffering off;
            proxy_buffering off;

            client_max_body_size 8G;

            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }
    }
}
