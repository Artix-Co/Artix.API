version: "3.9"

networks:
  internal_net:
    driver: bridge

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672" # پورت اصلی برای اتصال کلاینت‌ها
      - "15672:15672" # پنل مدیریت وب
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
  
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      SA_PASSWORD: "Hello&Run1234"
      ACCEPT_EULA: "Y"
    ports:
      - "1434:1433"
    networks:
      - internal_net
    restart: unless-stopped

  redis:
    container_name: redis
    image: redis:7
    restart: unless-stopped
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass "Heli@ghar771379"
  
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "Heli@ghar771379", "ping" ]
      interval: 30s
      retries: 3
      timeout: 10s
  
  
  
  
  
  app1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app1
    depends_on:
      - redis
    environment:
      - ASPNETCORE_URLS=http://+:80
      - DOTNET_RUNNING_IN_CONTAINER=true
      - DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=true
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - internal_net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:80/ || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3

  app2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app2
    depends_on:
      - redis
    environment:
      - ASPNETCORE_URLS=http://+:80
      - DOTNET_RUNNING_IN_CONTAINER=true
      - DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=true
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - internal_net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:80/ || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3

  app3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app3
    depends_on:
      - redis
    environment:
      - ASPNETCORE_URLS=http://+:80
      - DOTNET_RUNNING_IN_CONTAINER=true
      - DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=true
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - internal_net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:80/ || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "8080:80"
    depends_on:
      - app1
      - app2
      - app3
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    networks:
      - internal_net


volumes:
  esdata:
    driver: local
  rabbitmq_data:
  postgres_data:
    driver: local