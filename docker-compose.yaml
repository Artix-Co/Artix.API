networks:
  internal_net:
    driver: bridge

volumes:
  rabbitmq_data:
  postgres_data:
  dataprotection_keys:
  file_storage:
  mongodb_data:  # Add this line

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    user: root
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - internal_net
    restart: unless-stopped
    healthcheck:
      test: rabbitmqctl status
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    user: root
    container_name: sqlserver
    environment:
      SA_PASSWORD: "Hello&Run1234"
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
    ports:
      - "1434:1433"
    volumes:
      - ./mssql-data:/var/opt/mssql
    networks:
      - internal_net
    restart: unless-stopped
  
  
  mongodb:
    image: mongo:latest
    container_name: mongodb
    command: --setParameter authenticationMechanisms=SCRAM-SHA-1,SCRAM-SHA-256
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: MongoPass1234
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - internal_net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7
    container_name: redis
    user: root
    ports:
      - "6377:6377"
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass "Heli@ghar771379"
    networks:
      - internal_net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "Heli@ghar771379", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app1
    depends_on:
      redis:
        condition: service_healthy
      sqlserver:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:80
      DOTNET_RUNNING_IN_CONTAINER: true
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: 0
      DOCKER_BUILDKIT: 1
      COMPOSE_DOCKER_CLI_BUILD: 1
      
    expose:
      - 80
    volumes:
      - dataprotection_keys:/app/dataprotection-keys
      - file_storage:/app/files
    networks:
      - internal_net
    restart: unless-stopped

    healthcheck:
      test: curl -f http://localhost:80/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    extra_hosts:
      - "elasticsearch.drlink.ir:192.168.2.40"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "1"
          memory: 1G


  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    ports:
      - "8080:80"
    depends_on:
      app1:
        condition: service_started
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - internal_net
    restart: unless-stopped

