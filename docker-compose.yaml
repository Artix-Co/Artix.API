networks:
  internal_net:
    driver: bridge

volumes:
  rabbitmq_data:
  postgres_data:
  dataprotection_keys:
  file_storage:
  mongodb_data:

services:

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - internal_net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_running" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    user: root
    container_name: sqlserver
    environment:
      SA_PASSWORD: "Hello&Run1234"
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
    ports:
      - "1434:1433"
    volumes:
      - ./mssql-data:/var/opt/mssql
    networks:
      - internal_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G

  mongodb:
    image: mongo:latest
    container_name: mongodb
    command: --setParameter authenticationMechanisms=SCRAM-SHA-1,SCRAM-SHA-256
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: MongoPass1234
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - internal_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    healthcheck:
      test: [ "CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
  
  redis:
    image: redis:7
    container_name: redis
    user: root
    ports:
      - "6379:6379"
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass "Heli@ghar771379"
    networks:
      - internal_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "Heli@ghar771379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: artix-api
    environment:
        ASPNETCORE_ENVIRONMENT: Production
        DOTNET_RUNNING_IN_CONTAINER: "true"
        ASPNETCORE_URLS: "http://+:80"
    volumes:
      - dataprotection_keys:/app/dataprotection-keys
      - file_storage:/app/files
    depends_on:
      - rabbitmq
      - mongodb
      - redis
      - sqlserver
    networks:
      - internal_net
    restart: unless-stopped
    healthcheck:
      test: curl -f http://localhost:80/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    extra_hosts:
      - "elasticsearch.drlink.ir:192.168.2.40"

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "8080:80"
    depends_on:
      app1:
        condition: service_started
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - internal_net
    restart: unless-stopped