# Artix.API — GitLab CI
# Runner: shell executor on this host, Podman aliased as docker via DOCKER_HOST.
# No DinD, no image pull for CI jobs — commands run directly on the host shell.
#
# Branches:
#   feat/* fix/*  → build image
#   dev           → build image
#   main          → build + manual deploy to production
#
# Required CI/CD variables:
#   (none for deploy — runner is on same host as deploy target)
# Optional:
#   ENABLE_REGISTRY_PUSH=true  + CI_REGISTRY_* for registry push
#   GITHUB_MIRROR_REPO + GITHUB_MIRROR_TOKEN for GitHub sync

stages:
  - build
  - sync
  - deploy

variables:
  IMAGE_LOCAL: localhost/artix-api
  IMAGE_TAG: localhost/artix-api:$CI_COMMIT_SHORT_SHA
  DOCKER_HOST: unix:///var/run/podman/podman.sock
  DOCKER_BUILDKIT: "0"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

.build_rules: &build_rules
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH =~ /^feat\//
    - if: $CI_COMMIT_BRANCH =~ /^fix\//

.build_prepare: &build_prepare
  - |
    set -e
    avail_kb=$(df -Pk / | awk 'NR==2{print $4}')
    echo "Free disk before cleanup: $((avail_kb/1024))MB"
    if [ "$avail_kb" -lt 6144000 ]; then
      echo "Low disk — pruning dangling images/builders..."
      docker image prune -af || true
      docker builder prune -af || true
    fi
    avail_kb=$(df -Pk / | awk 'NR==2{print $4}')
    echo "Free disk before build: $((avail_kb/1024))MB"
    if [ "$avail_kb" -lt 3145728 ]; then
      echo "ERROR: need at least ~3GB free disk for build"
      df -h /
      docker system df || true
      exit 1
    fi

build:
  stage: build
  <<: *build_rules
  before_script:
    *build_prepare
  script:
    - docker version
    - docker system df || true
    - docker build -t "$IMAGE_TAG" -t "${IMAGE_LOCAL}:local" -t "${IMAGE_LOCAL}:latest" .
    - |
      if [ "${ENABLE_REGISTRY_PUSH:-}" = "true" ] && [ -n "${CI_REGISTRY:-}" ] && [ -n "${CI_REGISTRY_PASSWORD:-}" ]; then
        if echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"; then
          REG_TAG="$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
          docker tag "$IMAGE_TAG" "$REG_TAG"
          docker tag "$IMAGE_TAG" "$CI_REGISTRY_IMAGE:latest"
          docker push "$REG_TAG"
          docker push "$CI_REGISTRY_IMAGE:latest"
          echo "Pushed $REG_TAG"
        else
          echo "WARNING: registry login failed; keeping local image $IMAGE_TAG"
        fi
      else
        echo "Registry push skipped; using local image $IMAGE_TAG"
      fi
  after_script:
    - docker images "${IMAGE_LOCAL}" --format '{{.Repository}}:{{.Tag}}\t{{.ID}}\t{{.Size}}' || true
    - docker system df || true
    - docker image prune -af --filter "until=24h" || true
    - docker builder prune -af || true

deploy_production:
  stage: deploy
  needs: ["build"]
  resource_group: production
  environment:
    name: production
    url: https://api.studioartix.ir
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  script:
    - |
      set -e
      DEPLOY_PATH="${DEPLOY_PATH:-/root/artix-api}"
      cd "$DEPLOY_PATH"
      git fetch origin
      git checkout main
      git pull --ff-only origin main
      /root/scripts/zdd-api.sh "$DEPLOY_PATH" "${IMAGE_TAG}"

sync_github_mirror:
  stage: sync
  needs: ["build"]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"
  script:
    - |
      if [ -z "${GITHUB_MIRROR_REPO:-}" ] || [ -z "${GITHUB_MIRROR_TOKEN:-}" ]; then
        echo "GitHub mirror skipped. Set GITHUB_MIRROR_REPO and GITHUB_MIRROR_TOKEN to enable."
        exit 0
      fi
      TMPDIR=$(mktemp -d)
      git clone "$CI_REPOSITORY_URL" "$TMPDIR/repo"
      cd "$TMPDIR/repo"
      git remote add github "https://${GITHUB_MIRROR_TOKEN}@github.com/${GITHUB_MIRROR_REPO}.git"
      git push github "HEAD:${CI_COMMIT_BRANCH}"
      rm -rf "$TMPDIR"
