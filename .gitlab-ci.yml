# Artix.API — GitLab CI
# Runner on this host uses Podman via /var/run/docker.sock (no DinD).
#
# Branches:
#   feat/* fix/*  → build image
#   dev           → build image
#   main          → build + manual deploy to production
#
# Required CI/CD variables (project or group):
#   DEPLOY_HOST              e.g. 127.0.0.1 or 46.38.148.98
#   DEPLOY_USER              e.g. root
#   DEPLOY_PATH              e.g. /root/artix-api
#   SSH_PRIVATE_KEY_BASE64   base64 of the private key (same pattern as frontend)
# Optional:
#   SSH_PRIVATE_KEY          raw key if you prefer not to use base64

stages:
  - build
  - deploy

variables:
  IMAGE_LOCAL: localhost/artix-api
  IMAGE_TAG: localhost/artix-api:$CI_COMMIT_SHORT_SHA
  DOCKER_HOST: unix:///var/run/docker.sock
  FF_NETWORK_PER_BUILD: "true"
  # Classic builder — BuildKit/buildx hits Docker Hub for frontends and fails (403) behind Podman
  DOCKER_BUILDKIT: "0"

.build_rules: &build_rules
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH =~ /^feat\//
    - if: $CI_COMMIT_BRANCH =~ /^fix\//

build:
  stage: build
  image: docker:27-cli
  <<: *build_rules
  script:
    - docker version
    - docker build -t "$IMAGE_TAG" -t "${IMAGE_LOCAL}:local" -t "${IMAGE_LOCAL}:latest" .
    # Registry push is optional. Deploy uses host-local tags (localhost/artix-api:...).
    # GitLab injects CI_REGISTRY_* even when registry is broken (502) — never fail the job for that.
    - |
      if [ "${ENABLE_REGISTRY_PUSH:-}" = "true" ] && [ -n "${CI_REGISTRY:-}" ] && [ -n "${CI_REGISTRY_PASSWORD:-}" ]; then
        if echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"; then
          REG_TAG="$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
          docker tag "$IMAGE_TAG" "$REG_TAG"
          docker tag "$IMAGE_TAG" "$CI_REGISTRY_IMAGE:latest"
          docker push "$REG_TAG"
          docker push "$CI_REGISTRY_IMAGE:latest"
          echo "Pushed $REG_TAG"
        else
          echo "WARNING: registry login failed; keeping local image $IMAGE_TAG"
        fi
      else
        echo "Registry push skipped; using local image $IMAGE_TAG"
      fi
  after_script:
    - docker images "${IMAGE_LOCAL}" --format '{{.Repository}}:{{.Tag}}\t{{.ID}}\t{{.Size}}' || true

deploy_production:
  stage: deploy
  image: alpine:3.20
  needs: ["build"]
  resource_group: production
  environment:
    name: production
    url: https://api.studioartix.ir
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  before_script:
    - apk add --no-cache openssh-client curl
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - |
      if [ -n "${SSH_PRIVATE_KEY_BASE64:-}" ]; then
        echo "$SSH_PRIVATE_KEY_BASE64" | base64 -d > ~/.ssh/id_rsa
      elif [ -n "${SSH_PRIVATE_KEY:-}" ]; then
        printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
      else
        echo "Missing SSH_PRIVATE_KEY_BASE64 (or SSH_PRIVATE_KEY)"
        exit 1
      fi
    - chmod 600 ~/.ssh/id_rsa
    - printf 'Host *\n\tStrictHostKeyChecking no\n' > ~/.ssh/config
  script:
    - |
      test -n "${DEPLOY_HOST:-}"
      test -n "${DEPLOY_USER:-}"
      test -n "${DEPLOY_PATH:-}"
      ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "
        set -e
        cd '${DEPLOY_PATH}'
        git fetch origin
        git checkout main
        git pull --ff-only origin main
        export APP_IMAGE='${IMAGE_TAG}'
        docker-compose -p artix up -d --no-build
        docker-compose -p artix ps
        curl -fsS http://127.0.0.1:8080/health/ready
        echo
      "
